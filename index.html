<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Animation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Interactive Animation with Local Storage</h1>
    <p>Choose an animation and click the button below to trigger it:</p>
    <select id="animation-selector">
        <option value="bounce">Bounce</option>
        <option value="spin">Spin</option>
    </select>
    <button id="animate-btn">Animate Box</button>
    <button id="reset-btn">Reset Preferences</button>
    <div id="animated-box"></div>
    <p id="status-message"></p>

    <script src="script.js"></script>
</body>
</html>
